name: PR checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: development
      TIMELINE_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      BACKUP_TEST_MONGO_URI: mongodb://127.0.0.1:27017
      MONGODB_TOOLS_VERSION: 100.13.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Install dependencies
        run: |
          npm install --global pnpm@12.3.4
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @your_spotify/client typecheck
          pnpm --filter @your_spotify/server typecheck
      - name: Lint and format
        run: |
          pnpm --filter @your_spotify/client lint
          pnpm --filter @your_spotify/server lint
      # The backup test dumps and restores a real archive.
      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mongodb-tools.deb" \
            "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-$MONGODB_TOOLS_VERSION.deb"
          sudo apt-get install -y "$RUNNER_TEMP/mongodb-tools.deb"
      - name: Regression tests
        run: pnpm --filter @your_spotify/server test
      - name: Production builds
        env:
          NODE_ENV: production
        run: |
          pnpm --filter @your_spotify/client build
          pnpm --filter @your_spotify/server build
